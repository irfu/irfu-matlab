# ref: https://commitlint.js.org/guides/ci-setup.html#github-actions, as read 2026-11-25
name: CI-convensional-commits

on:
  # Triggers this workflow on push to devel, MMSdevel, SOdevel. Or pull requests to devel.
  push:
    branches: [ devel, MMSdevel, SOdevel ]
  pull_request:
    branches: [ devel ]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      #- name: Setup node
      #  uses: actions/setup-node@v4
      #  with:
      #    node-version: lts/*
      #    cache: npm
      - name: Install commitlint
        run: npm install -D @commitlint/cli @commitlint/config-conventional
      - name: Print versions
        run: |
          git --version
          node --version
          npm --version
          npx commitlint --version

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
